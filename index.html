<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

    overflow-x:hidden;
}

/* Image styling */
.slider-img{
    width:100%;
    height:250px;
    object-fit:cover;
}

/* border clean */
.swiper-slide{
    background:#fff;
    border-radius:5px;
    overflow:hidden;
}

</style>

</head>

<body>

<header class="container-fluid">
<nav class="navbar navbar-expand-lg">
  <div class="container">

    <a class="navbar-brand" href="#">
      <img src="assets/images/RV-Logo.png" alt="Logo">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">

        <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">ABOUT US</a></li>

        <li class="nav-item"><a class="nav-link" href="contact-us.html">CONTACT US</a></li>
        <li class="nav-item"><a class="nav-link" href="gallery.html">GALLERY</a></li>

      </ul>
    </div>

  </div>
</nav>
</header>

<!-- ================= SLIDER ================= -->
<div class="container mt-5 mb-5">

  <h3 class="mb-2">SHEET METAL FORMING AND FABRICATION PARTS</h3>
  <p class="text-muted mb-4">We Manufacturing All Types Of Sheet Metal Parts</p>

  <div class="swiper swiper5">

    <div class="swiper-wrapper">

      <div class="swiper-slide">
        <img src="assets/images/machining-services.jpg" class="slider-img">
        <a href="#" class="text-decoration-none text-dark"> <h5 class="text-center mt-3">RV Indotech</h5> </a>
        
      </div>

      <div class="swiper-slide">
        <img src="assets/images/casting-services.jpg" class="slider-img">
        <h5 class="text-center mt-3">RV Indotech</h5>  
      </div>

      <div class="swiper-slide">
        <img src="assets/images/plastic-molding-parts-services.jpg" class="slider-img">
        <h5 class="text-center mt-3">RV Indotech</h5>  
      </div>

      <div class="swiper-slide">
        <a href="#"> <img src="assets/images/sheet-metal-forming-and-fabrication-services.jpg" class="slider-img"></a>
      <h5 class="text-center mt-3">RV Indotech</h5>  
      </div>

      <div class="swiper-slide">
        <img src="assets/images/forging-services.jpg" class="slider-img">
        <h5 class="text-center mt-3">RV Indotech</h5>  
      </div>
    </div>

    <!-- Navigation -->
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>

  </div>

</div>

<!-- ================= SWIPER JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    new Swiper(".swiper5", {

        slidesPerView: 3,
        spaceBetween: 20,
        loop: true,

        autoplay: {
            delay: 2000,
            disableOnInteraction: false
        },

        navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev"
        },

        breakpoints: {
            0: {
                slidesPerView: 1
            },
            768: {
                slidesPerView: 2
            },
            1024: {
                slidesPerView: 3
            }
        }

    });

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
